<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Architecture Transformation: Before vs After</text>
  <text x="550" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">From Fragile Relational Spaghetti to Production-Grade Kimball Star Schema</text>

  <!-- Left Box: Before (The Nightmare Model) -->
  <rect x="30" y="90" width="500" height="380" rx="12" fill="#1c1917" stroke="#dc2626" stroke-width="2"/>
  <rect x="30" y="90" width="500" height="40" rx="12" fill="#7f1d1d" />
  <text x="280" y="117" text-anchor="middle" fill="#fecaca" font-size="15" font-weight="700">❌ BEFORE: The Legacy "Nightmare" Schema</text>

  <!-- Left items -->
  <g transform="translate(50, 150)">
    <!-- Point 1 -->
    <circle cx="15" cy="15" r="14" fill="#991b1b"/>
    <text x="15" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">1</text>
    <text x="40" y="16" fill="#fca5a5" font-size="13" font-weight="700">Fact-to-Fact M:M Coupling</text>
    <text x="40" y="34" fill="#cbd5e1" font-size="11">fact_sales_target joined directly to fact_campaign_spend (loops &amp; cartesian bloat).</text>

    <!-- Point 2 -->
    <circle cx="15" cy="75" r="14" fill="#991b1b"/>
    <text x="15" y="80" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">2</text>
    <text x="40" y="76" fill="#fca5a5" font-size="13" font-weight="700">Granularity Mismatch &amp; Missing Dates</text>
    <text x="40" y="94" fill="#cbd5e1" font-size="11">Daily sales with timestamps vs. monthly 1st snapshots caused missing/blank joins.</text>

    <!-- Point 3 -->
    <circle cx="15" cy="135" r="14" fill="#991b1b"/>
    <text x="15" y="140" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">3</text>
    <text x="40" y="136" fill="#fca5a5" font-size="13" font-weight="700">4-Tier Snowflake Hierarchy</text>
    <text x="40" y="154" fill="#cbd5e1" font-size="11">Products ➔ Subcategories ➔ Categories ➔ Suppliers caused multi-hop filter delays.</text>

    <!-- Point 4 -->
    <circle cx="15" cy="195" r="14" fill="#991b1b"/>
    <text x="15" y="200" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">4</text>
    <text x="40" y="196" fill="#fca5a5" font-size="13" font-weight="700">Column Clutter &amp; Low Cardinality</text>
    <text x="40" y="214" fill="#cbd5e1" font-size="11">Channel, priority, and fulfillment flags directly repeated across 200+ sales rows.</text>

    <!-- Point 5 -->
    <circle cx="15" cy="255" r="14" fill="#991b1b"/>
    <text x="15" y="260" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">5</text>
    <text x="40" y="256" fill="#fca5a5" font-size="13" font-weight="700">No Enterprise Security (RLS)</text>
    <text x="40" y="274" fill="#cbd5e1" font-size="11">Unrestricted regional access; raw security spreadsheet lacked column headers.</text>
  </g>

  <!-- Right Box: After (Kimball Star Schema) -->
  <rect x="570" y="90" width="500" height="380" rx="12" fill="#0f172a" stroke="#059669" stroke-width="2"/>
  <rect x="570" y="90" width="500" height="40" rx="12" fill="#065f46" />
  <text x="820" y="117" text-anchor="middle" fill="#a7f3d0" font-size="15" font-weight="700">✔ AFTER: The Refactored Star Schema</text>

  <!-- Right items -->
  <g transform="translate(590, 150)">
    <!-- Point 1 -->
    <circle cx="15" cy="15" r="14" fill="#047857"/>
    <text x="15" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">✔</text>
    <text x="40" y="16" fill="#6ee7b7" font-size="13" font-weight="700">Conformed Bridge Architecture</text>
    <text x="40" y="34" fill="#cbd5e1" font-size="11">Zero fact-to-fact joins. All cross-fact filtering routes cleanly via shared dimensions.</text>

    <!-- Point 2 -->
    <circle cx="15" cy="75" r="14" fill="#047857"/>
    <text x="15" y="80" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">✔</text>
    <text x="40" y="76" fill="#6ee7b7" font-size="13" font-weight="700">Authoritative dim_date Table</text>
    <text x="40" y="94" fill="#cbd5e1" font-size="11">730 continuous days aligning daily sales and monthly targets in a single visual.</text>

    <!-- Point 3 -->
    <circle cx="15" cy="135" r="14" fill="#047857"/>
    <text x="15" y="140" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">✔</text>
    <text x="40" y="136" fill="#6ee7b7" font-size="13" font-weight="700">Flattened dim_product (60 rows, 8 cols)</text>
    <text x="40" y="154" fill="#cbd5e1" font-size="11">Eliminated 4 normalized tables into 1 clean dimension for instant DAX filter sweeps.</text>

    <!-- Point 4 -->
    <circle cx="15" cy="195" r="14" fill="#047857"/>
    <text x="15" y="200" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">✔</text>
    <text x="40" y="196" fill="#6ee7b7" font-size="13" font-weight="700">14-Row Junk Dimension (dim_order_flags)</text>
    <text x="40" y="214" fill="#cbd5e1" font-size="11">Consolidated all status codes into surrogate flag_key, optimizing VertiPaq RAM.</text>

    <!-- Point 5 -->
    <circle cx="15" cy="255" r="14" fill="#047857"/>
    <text x="15" y="260" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">✔</text>
    <text x="40" y="256" fill="#6ee7b7" font-size="13" font-weight="700">Dynamic User-Principal RLS</text>
    <text x="40" y="274" fill="#cbd5e1" font-size="11">Promoted headers, mapped security[region] ➔ dim_customer via USERPRINCIPALNAME().</text>
  </g>
</svg>

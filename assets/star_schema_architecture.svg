<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="factGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2540"/>
    </linearGradient>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d24"/>
      <stop offset="100%" stop-color="#2a0f14"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="0.5">Enterprise Kimball Star Schema Architecture</text>
  <text x="550" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Multi-Fact Transactional Refactoring • 1-to-Many Unidirectional Filtering • Dynamic RLS</text>

  <!-- Legend -->
  <rect x="340" y="90" width="16" height="16" rx="4" fill="#38bdf8" />
  <text x="365" y="103" fill="#cbd5e1" font-size="12" font-weight="600">Conformed Dimension (1)</text>
  <rect x="520" y="90" width="16" height="16" rx="4" fill="#f59e0b" />
  <text x="545" y="103" fill="#cbd5e1" font-size="12" font-weight="600">Fact Table (Many / *)</text>
  <rect x="675" y="90" width="16" height="16" rx="4" fill="#f43f5e" />
  <text x="700" y="103" fill="#cbd5e1" font-size="12" font-weight="600">Security / RLS</text>

  <!-- Connectors (Lines) -->
  <!-- dim_date (center top) to facts -->
  <path d="M 550 200 L 230 330" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <path d="M 550 200 L 550 330" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
  <path d="M 550 200 L 870 330" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <path d="M 550 200 L 230 500" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- dim_customer to fact_sales & fact_order_process -->
  <path d="M 230 200 L 550 350" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  <path d="M 230 200 L 230 490" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  <path d="M 170 160 L 80 160" stroke="#f43f5e" stroke-width="2.5" opacity="0.9"/>

  <!-- dim_product to fact_sales, fact_inventory, fact_promotion -->
  <path d="M 870 200 L 570 340" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  <path d="M 870 200 L 870 330" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  <path d="M 870 200 L 870 490" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>

  <!-- dim_geo to fact_sales -->
  <path d="M 430 540 L 520 400" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <!-- dim_order_flags to fact_sales -->
  <path d="M 670 540 L 580 400" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <!-- dim_campaign to fact_campaign_spend & fact_promotion -->
  <path d="M 550 630 L 840 540" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>

  <!-- TOP DIMENSIONS ROW -->
  <!-- dim_customer -->
  <g filter="url(#shadow)">
    <rect x="170" y="130" width="150" height="90" rx="8" fill="url(#dimGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="170" y="130" width="150" height="26" rx="8" fill="#0284c7" />
    <text x="245" y="148" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">dim_customer (1)</text>
    <text x="180" y="172" fill="#93c5fd" font-size="11">🔑 customer_id [PK]</text>
    <text x="180" y="190" fill="#94a3b8" font-size="11">customer_name, email</text>
    <text x="180" y="208" fill="#f43f5e" font-size="11" font-weight="600">region [RLS Filter]</text>
  </g>

  <!-- security table (left of customer) -->
  <g filter="url(#shadow)">
    <rect x="20" y="130" width="125" height="75" rx="8" fill="url(#secGrad)" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="20" y="130" width="125" height="24" rx="8" fill="#e11d48" />
    <text x="82" y="147" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">security (RLS)</text>
    <text x="28" y="170" fill="#fda4af" font-size="11">user_email (UPN)</text>
    <text x="28" y="188" fill="#f43f5e" font-size="11" font-weight="600">region [1:M Join]</text>
  </g>

  <!-- dim_date (Center Anchor) -->
  <g filter="url(#shadow)">
    <rect x="470" y="130" width="160" height="95" rx="8" fill="url(#dimGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="470" y="130" width="160" height="28" rx="8" fill="#0284c7" />
    <text x="550" y="149" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">dim_date (Bridge)</text>
    <text x="480" y="175" fill="#93c5fd" font-size="11">🔑 Date [PK - Continuous]</text>
    <text x="480" y="193" fill="#cbd5e1" font-size="11">year [Calculated DAX]</text>
    <text x="480" y="211" fill="#cbd5e1" font-size="11">month [Calculated DAX]</text>
  </g>

  <!-- dim_product -->
  <g filter="url(#shadow)">
    <rect x="790" y="130" width="160" height="95" rx="8" fill="url(#dimGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="790" y="130" width="160" height="26" rx="8" fill="#0284c7" />
    <text x="870" y="148" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">dim_product (1)</text>
    <text x="800" y="172" fill="#93c5fd" font-size="11">🔑 product_key [PK]</text>
    <text x="800" y="190" fill="#94a3b8" font-size="11">product_name, price</text>
    <text x="800" y="208" fill="#94a3b8" font-size="11">category, supplier</text>
  </g>

  <!-- CENTER CORE FACT ROW -->
  <!-- fact_sales (Primary Fact) -->
  <g filter="url(#shadow)">
    <rect x="460" y="310" width="180" height="120" rx="8" fill="url(#factGrad)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="460" y="310" width="180" height="28" rx="8" fill="#d97706" />
    <text x="550" y="329" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">fact_sales (*)</text>
    <text x="470" y="355" fill="#fbbf24" font-size="11">order_date ➔ dim_date</text>
    <text x="470" y="372" fill="#fbbf24" font-size="11">customer_id ➔ dim_cust</text>
    <text x="470" y="389" fill="#fbbf24" font-size="11">product_key ➔ dim_prod</text>
    <text x="470" y="406" fill="#34d399" font-size="11" font-weight="600">line_total (\$526,643.91)</text>
    <text x="470" y="422" fill="#94a3b8" font-size="10">quantity, unit_price, cost</text>
  </g>

  <!-- fact_sales_target (Left Fact) -->
  <g filter="url(#shadow)">
    <rect x="150" y="320" width="160" height="85" rx="8" fill="url(#factGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="150" y="320" width="160" height="24" rx="8" fill="#b45309" />
    <text x="230" y="337" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">fact_sales_target (*)</text>
    <text x="160" y="360" fill="#fbbf24" font-size="11">date [1st of Month]</text>
    <text x="160" y="378" fill="#34d399" font-size="11" font-weight="600">target_revenue (\$552,000)</text>
    <text x="160" y="394" fill="#94a3b8" font-size="10">Monthly grain (20 periods)</text>
  </g>

  <!-- fact_inventory (Right Fact) -->
  <g filter="url(#shadow)">
    <rect x="790" y="320" width="160" height="85" rx="8" fill="url(#factGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="790" y="320" width="160" height="24" rx="8" fill="#b45309" />
    <text x="870" y="337" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">fact_inventory (*)</text>
    <text x="800" y="360" fill="#fbbf24" font-size="11">month [1st of Month]</text>
    <text x="800" y="378" fill="#fbbf24" font-size="11">product_key ➔ dim_prod</text>
    <text x="800" y="396" fill="#34d399" font-size="11" font-weight="600">units (73,922 units)</text>
  </g>

  <!-- BOTTOM ROW (Other Dimensions & Facts) -->
  <!-- fact_order_process -->
  <g filter="url(#shadow)">
    <rect x="150" y="470" width="160" height="95" rx="8" fill="url(#factGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="150" y="470" width="160" height="24" rx="8" fill="#b45309" />
    <text x="230" y="487" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">fact_order_process (*)</text>
    <text x="160" y="510" fill="#fbbf24" font-size="11">order_date ➔ dim_date</text>
    <text x="160" y="527" fill="#fbbf24" font-size="11">customer_id ➔ dim_cust</text>
    <text x="160" y="544" fill="#34d399" font-size="11" font-weight="600">order_to_pay (32.84d avg)</text>
    <text x="160" y="559" fill="#94a3b8" font-size="10">ship, delivery, invoice</text>
  </g>

  <!-- dim_geo -->
  <g filter="url(#shadow)">
    <rect x="350" y="510" width="150" height="85" rx="8" fill="url(#dimGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="350" y="510" width="150" height="24" rx="8" fill="#0284c7" />
    <text x="425" y="527" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">dim_geo (Role-Playing)</text>
    <text x="360" y="550" fill="#93c5fd" font-size="11">🔑 geo_key [PK]</text>
    <text x="360" y="567" fill="#38bdf8" font-size="10">Active: ship_to_city_key</text>
    <text x="360" y="583" fill="#cbd5e1" font-size="10">Inactive: bill_to_city_key</text>
  </g>

  <!-- dim_order_flags (Junk Dim) -->
  <g filter="url(#shadow)">
    <rect x="600" y="510" width="150" height="85" rx="8" fill="url(#dimGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="600" y="510" width="150" height="24" rx="8" fill="#0284c7" />
    <text x="675" y="527" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">dim_order_flags (Junk)</text>
    <text x="610" y="550" fill="#93c5fd" font-size="11">🔑 flag_key [PK - 14 rows]</text>
    <text x="610" y="567" fill="#94a3b8" font-size="10">channel (Online, Store)</text>
    <text x="610" y="583" fill="#94a3b8" font-size="10">priority (High, Low, Med)</text>
  </g>

  <!-- fact_promotion_coverage & fact_campaign_spend -->
  <g filter="url(#shadow)">
    <rect x="790" y="470" width="160" height="95" rx="8" fill="url(#factGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="790" y="470" width="160" height="24" rx="8" fill="#b45309" />
    <text x="870" y="487" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">fact_campaign / promo (*)</text>
    <text x="800" y="510" fill="#fbbf24" font-size="11">campaign_key ➔ dim_camp</text>
    <text x="800" y="527" fill="#fbbf24" font-size="11">product_key ➔ dim_prod</text>
    <text x="800" y="544" fill="#34d399" font-size="11" font-weight="600">spend &amp; coverage</text>
    <text x="800" y="559" fill="#94a3b8" font-size="10">dim_campaign (6 campaigns)</text>
  </g>

  <!-- Footer Banner -->
  <rect x="250" y="635" width="600" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="550" y="660" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">✔ 100% Deterministic Single-Direction Filtering  •  ✔ Zero Relationship Loops  •  ✔ Strict Kimball Star Schema</text>
</svg>
